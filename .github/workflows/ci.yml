name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Linux dependencies for Tauri
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libasound2-dev

      - uses: jdx/mise-action@v4
        with:
          install: true
          cache: true

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install npm dependencies
        run: pnpm install --frozen-lockfile

      - name: Provide a null audio device
        # The player tests open a real output device; without one they
        # would skip and the audio path would never be exercised.
        run: |
          printf 'pcm.!default { type null }\nctl.!default { type null }\n' > "$HOME/.asoundrc"

      - name: Elm lint
        run: pnpm lint:elm

      - name: Elm tests
        run: pnpm test:elm

      - name: Frontend build
        run: pnpm build

      - name: Rust format
        run: cargo fmt --check
        working-directory: src-tauri

      - name: Rust clippy
        run: cargo clippy --all-targets -- -D warnings
        working-directory: src-tauri

      - name: Rust tests
        run: cargo test
        working-directory: src-tauri

  build-linux:
    name: Build Linux app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Linux dependencies for Tauri
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libasound2-dev

      - uses: jdx/mise-action@v4
        with:
          install: true
          cache: true

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install npm dependencies
        run: pnpm install --frozen-lockfile

      - name: Build app
        run: pnpm tauri build --no-bundle

      - uses: actions/upload-artifact@v7
        with:
          name: satsuma-linux
          path: src-tauri/target/release/satsuma
          if-no-files-found: error
