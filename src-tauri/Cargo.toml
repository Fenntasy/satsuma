[package]
name = "satsuma"
version = "0.1.0"
description = "A modern music player"
edition = "2021"
rust-version = "1.96"
license = "MIT"

[lib]
name = "satsuma_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
tauri = { version = "=2.11.5", features = [] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
rusqlite = { version = "=0.40.2", features = ["bundled"] }
lofty = "=0.25.1"
walkdir = "=2.5.0"
tauri-plugin-dialog = "=2.7.3"
thiserror = "=2.0.20"
log = "=0.4.34"

[dev-dependencies]
tempfile = "=3.27.0"

[lints.clippy]
all = "warn"
pedantic = "warn"
