[package]
name = "satsuma"
version = "0.1.0"
description = "A modern music player"
edition = "2021"
rust-version = "1.96"
license = "MIT"

[lib]
name = "satsuma_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
tauri = { version = "=2.11.5", features = [] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
rusqlite = { version = "=0.40.2", features = ["bundled"] }
lofty = "=0.25.1"
walkdir = "=2.5.0"
rand = "=0.10.2"
rodio = { version = "=0.22.2", default-features = false, features = ["playback", "symphonia-mp3", "symphonia-flac", "symphonia-vorbis", "symphonia-wav", "symphonia-isomp4", "symphonia-aac"] }
tauri-plugin-dialog = "=2.7.3"
tauri-plugin-log = "=2.9.1"
thiserror = "=2.0.20"
log = "=0.4.34"

[dev-dependencies]
tempfile = "=3.27.0"

[profile.dev]
incremental = true

# A player ships as a binary someone downloads, so the release build is
# tuned for size. `panic` is deliberately left unwinding: a panic in the
# player thread must not take the window down with it, and the recovery
# from a poisoned lock in `commands.rs` only means anything while a panic
# unwinds.
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true

[lints.rust]
ambiguous_negative_literals = "warn"
missing_debug_implementations = "warn"
redundant_imports = "warn"
redundant_lifetimes = "warn"
trivial_numeric_casts = "warn"
unsafe_op_in_unsafe_fn = "warn"
unused_lifetimes = "warn"

[lints.clippy]
all = "warn"
pedantic = "warn"

# Lints that catch the mistakes this repository actually made: an override
# with no reason, a write whose result was dropped, a panic with nothing in
# its message.
allow_attributes_without_reason = "warn"
assertions_on_result_states = "warn"
clone_on_ref_ptr = "warn"
if_then_some_else_none = "warn"
map_err_ignore = "warn"
undocumented_unsafe_blocks = "warn"
unnecessary_safety_comment = "warn"
unnecessary_safety_doc = "warn"
unused_result_ok = "warn"
